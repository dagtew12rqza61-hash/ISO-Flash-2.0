name: Build Debian packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache downloaded Debian packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ubuntu-24.04-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ubuntu-24.04-apt-
      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=2 update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev dpkg-dev
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel "$(nproc)"
      - name: Run safety regression tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Assemble Debian packages
        run: |
          set -euo pipefail
          rm -rf pkg-engine pkg-app dist
          mkdir -p pkg-engine/DEBIAN pkg-engine/usr/lib/iso-flash pkg-app/DEBIAN pkg-app/usr/bin pkg-app/usr/share/applications dist
          install -m 0755 build/engine/iso-flash-write pkg-engine/usr/lib/iso-flash/iso-flash-write
          install -m 0644 packaging/engine/control pkg-engine/DEBIAN/control
          install -m 0644 packaging/application/control pkg-app/DEBIAN/control
          install -m 0755 build/gui/iso-flash pkg-app/usr/bin/iso-flash
          install -m 0644 packaging/iso-flash.desktop pkg-app/usr/share/applications/iso-flash.desktop
          dpkg-deb --root-owner-group --build pkg-engine dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --root-owner-group --build pkg-app dist/iso-flash_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash_2.0.0_amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: iso-flash-deb-amd64
          path: dist/*.deb
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
