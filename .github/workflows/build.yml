name: Build Debian packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get -o Acquire::Retries=2 update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libglib2.0-dev qt6-base-dev dpkg-dev
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel "$(nproc)"
      - name: Run safety regression tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Assemble Debian packages
        run: |
          set -euo pipefail
          rm -rf pkg-engine pkg-app dist
          mkdir -p pkg-engine/DEBIAN pkg-engine/usr/lib/iso-flash pkg-engine/usr/share/dbus-1/system-services pkg-engine/usr/lib/systemd/system pkg-app/DEBIAN pkg-app/usr/bin pkg-app/usr/share/applications dist
          install -m 0755 build/engine/iso-flash-write pkg-engine/usr/lib/iso-flash/iso-flash-write
          install -m 0755 build/engine/iso-flash-service pkg-engine/usr/lib/iso-flash/iso-flash-service
          install -m 0644 packaging/engine/control pkg-engine/DEBIAN/control
          install -m 0644 packaging/dbus/org.iso_flash.Manager1.service pkg-engine/usr/share/dbus-1/system-services/org.iso_flash.Manager1.service
          install -m 0644 packaging/systemd/iso-flash.service pkg-engine/usr/lib/systemd/system/iso-flash.service
          install -m 0644 packaging/application/control pkg-app/DEBIAN/control
          install -m 0755 build/gui/iso-flash pkg-app/usr/bin/iso-flash
          install -m 0644 packaging/iso-flash.desktop pkg-app/usr/share/applications/iso-flash.desktop
          dpkg-deb --root-owner-group --build pkg-engine dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --root-owner-group --build pkg-app dist/iso-flash_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash_2.0.0_amd64.deb
      - name: Install and smoke-test Debian packages
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y ./dist/iso-flash-engine_2.0.0_amd64.deb ./dist/iso-flash_2.0.0_amd64.deb
          dpkg-query -W -f='${db:Status-Status} ${Version} ${Architecture}\\n' iso-flash-engine iso-flash
          test -x /usr/lib/iso-flash/iso-flash-write
          test -x /usr/lib/iso-flash/iso-flash-service
          test -x /usr/bin/iso-flash
          test -f /usr/share/dbus-1/system-services/org.iso_flash.Manager1.service
          test -f /usr/lib/systemd/system/iso-flash.service
          systemd-analyze verify /usr/lib/systemd/system/iso-flash.service
          set +e
          /usr/lib/iso-flash/iso-flash-write --write /tmp/iso-flash-smoke.iso /dev/null
          status=$?
          set -e
          test "$status" -eq 3
      - uses: actions/upload-artifact@v7
        with:
          name: iso-flash-deb-amd64
          path: dist/*.deb
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
