name: Build Debian packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          set -euo pipefail
          timeout 20m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 update
          timeout 20m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 install -y --no-install-recommends build-essential cmake ninja-build pkg-config libglib2.0-dev qt6-base-dev dpkg-dev dbus-daemon libglib2.0-bin
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel "$(nproc)"
      - name: Run safety regression tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Assemble Debian packages
        run: |
          set -euo pipefail
          rm -rf pkg-engine pkg-app dist
          mkdir -p pkg-engine/DEBIAN pkg-engine/usr/lib/iso-flash pkg-engine/usr/share/dbus-1/system-services pkg-engine/usr/lib/systemd/system pkg-app/DEBIAN pkg-app/usr/bin pkg-app/usr/share/applications dist
          install -m 0755 build/engine/iso-flash-write pkg-engine/usr/lib/iso-flash/iso-flash-write
          install -m 0755 build/engine/iso-flash-service pkg-engine/usr/lib/iso-flash/iso-flash-service
          install -m 0644 packaging/engine/control pkg-engine/DEBIAN/control
          install -m 0644 packaging/dbus/org.iso_flash.Manager1.service pkg-engine/usr/share/dbus-1/system-services/org.iso_flash.Manager1.service
          install -m 0644 packaging/systemd/iso-flash.service pkg-engine/usr/lib/systemd/system/iso-flash.service
          install -m 0644 packaging/application/control pkg-app/DEBIAN/control
          install -m 0755 build/gui/iso-flash pkg-app/usr/bin/iso-flash
          install -m 0644 packaging/iso-flash.desktop pkg-app/usr/share/applications/iso-flash.desktop
          dpkg-deb --root-owner-group --build pkg-engine dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --root-owner-group --build pkg-app dist/iso-flash_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash-engine_2.0.0_amd64.deb
          dpkg-deb --info dist/iso-flash_2.0.0_amd64.deb
      - name: Install and smoke-test Debian packages
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y ./dist/iso-flash-engine_2.0.0_amd64.deb ./dist/iso-flash_2.0.0_amd64.deb
          dpkg-query -W -f='${db:Status-Status} ${Version} ${Architecture}\\n' iso-flash-engine iso-flash
          test -x /usr/lib/iso-flash/iso-flash-write
          test -x /usr/lib/iso-flash/iso-flash-service
          test -x /usr/bin/iso-flash
          test -f /usr/share/dbus-1/system-services/org.iso_flash.Manager1.service
          test -f /usr/lib/systemd/system/iso-flash.service
          systemd-analyze verify /usr/lib/systemd/system/iso-flash.service
          if grep -q '^ProcSubset=pid$' /usr/lib/systemd/system/iso-flash.service; then echo 'ProcSubset=pid hides /proc/swaps required by DeviceGuard' >&2; exit 1; fi
          grep -q '^ProtectProc=invisible$' /usr/lib/systemd/system/iso-flash.service
          grep -q '^PrivateDevices=false$' /usr/lib/systemd/system/iso-flash.service
          set +e
          /usr/lib/iso-flash/iso-flash-write --write /tmp/iso-flash-smoke.iso /dev/null
          status=$?
          set -e
          test "$status" -eq 3
      - name: Verify loop devices are rejected as non-USB targets
        run: |
          set -euo pipefail
          image=$(mktemp)
          loop_device=''
          cleanup() {
            if [ -n "$loop_device" ]; then sudo losetup --detach "$loop_device" || true; fi
            rm -f "$image"
          }
          trap cleanup EXIT
          truncate -s 16M "$image"
          sudo modprobe loop
          loop_device=$(sudo losetup --find --show "$image")
          set +e
          output=$(/usr/lib/iso-flash/iso-flash-write --check "$loop_device" 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          test "$status" -eq 4
          printf '%s' "$output" | grep -q 'no verified USB transport ancestor'
      - name: Exercise read-only D-Bus inspection API
        run: |
          set -euo pipefail
          bus_info=$(dbus-daemon --session --fork --print-address=1 --print-pid=1)
          bus_address=$(printf '%s\\n' "$bus_info" | sed -n '1p')
          bus_pid=$(printf '%s\\n' "$bus_info" | sed -n '2p')
          service_pid=''
          cleanup() {
            if [ -n "$service_pid" ]; then kill "$service_pid" 2>/dev/null || true; fi
            kill "$bus_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DBUS_SYSTEM_BUS_ADDRESS="$bus_address"
          /usr/lib/iso-flash/iso-flash-service &
          service_pid=$!
          ready=0
          for attempt in $(seq 1 50); do
            if gdbus introspect --system --dest org.iso_flash.Manager1 --object-path /org/iso_flash/Manager1 >/tmp/iso-flash-dbus-introspection.txt 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          grep -q 'InspectTarget' /tmp/iso-flash-dbus-introspection.txt
          grep -q 'ValidateImage' /tmp/iso-flash-dbus-introspection.txt
          reply=$(gdbus call --system --dest org.iso_flash.Manager1 --object-path /org/iso_flash/Manager1 --method org.iso_flash.Manager1.InspectTarget 1 3)
          printf '%s\\n' "$reply"
          printf '%s' "$reply" | grep -q 'false'
          build/tests/test_dbus_fd_client
      - uses: actions/upload-artifact@v7
        with:
          name: iso-flash-deb-amd64
          path: dist/*.deb
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
