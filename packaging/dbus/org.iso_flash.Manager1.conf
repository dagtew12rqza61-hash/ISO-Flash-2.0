<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.iso_flash.Manager1"/>
    <allow send_type="signal" send_interface="org.iso_flash.Manager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.iso_flash.Manager1"/>
  </policy>
</busconfig>
